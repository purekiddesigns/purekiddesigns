<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | purekid! Creative Graphic Designer</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* 1. RESET & SYSTEM */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: #fcfcfc; 
            font-family: 'Inter', sans-serif; 
            height: 100vh; width: 100vw; 
            overflow: hidden; 
        }

        /* 2. NAVIGATION UI (DESKTOP) */
        header, footer { 
            position: fixed; left: 0; width: 100%; 
            display: flex; justify-content: center; 
            padding: 0 60px; z-index: 10000; pointer-events: none; 
        }
        header { top: 50px; } footer { bottom: 50px; }
        .ui-constraint { width: 100%; max-width: 1800px; display: flex; justify-content: space-between; align-items: center; }
        .header-logo, nav, .footer-socials, .copyright, .mobile-nav-toggle, .mobile-footer-icons { pointer-events: auto; }
        
        /* LOGO INTERACTION: Desktop-only, mouse-only rotation */
        .header-logo img { height: 42px; transition: 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @media (min-width: 769px) and (hover: hover) {
            .header-logo:hover img { transform: scale(1.15) rotate(360deg); }
        }

        nav { display: flex; gap: 30px; }
        nav .nav-link { font-family: 'Montserrat', sans-serif; text-decoration: none; color: #000; font-size: 0.85rem; font-weight: 600; position: relative; }
        nav .nav-link:hover { background: linear-gradient(to right, #4285F4, #EA4335, #FBBC05, #34A853); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        nav .nav-link.active::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 3px; background: linear-gradient(to right, #4285F4, #EA4335, #FBBC05, #34A853); border-radius: 2px; }

        /* 3. GRADIENT HAMBURGER ICON */
        .mobile-nav-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            width: 28px;
            height: 22px;
            position: relative;
            z-index: 10100;
        }
        .mobile-nav-toggle span {
            display: block;
            width: 100%;
            height: 3px;
            background: linear-gradient(to right, #4285F4, #EA4335, #FBBC05, #34A853);
            border-radius: 2px;
            position: absolute;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .mobile-nav-toggle span:nth-child(1) { top: 0; }
        .mobile-nav-toggle span:nth-child(2) { top: 9px; }
        .mobile-nav-toggle span:nth-child(3) { top: 18px; }

        .mobile-nav-toggle.open span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
        .mobile-nav-toggle.open span:nth-child(2) { opacity: 0; transform: translateX(10px); }
        .mobile-nav-toggle.open span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

        /* 4. MICRO-DROPDOWN MENU SYSTEM */
        .mobile-dropdown {
            position: fixed;
            top: 85px; 
            right: 30px; 
            width: 180px; 
            background-color: rgba(252, 252, 252, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 9999; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .mobile-dropdown.open {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .mobile-dropdown .nav-link {
            font-family: 'Montserrat', sans-serif;
            text-decoration: none;
            color: #000;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            transition: 0.2s;
        }
        .mobile-dropdown .nav-link:hover, .mobile-dropdown .nav-link.active {
            background: linear-gradient(to right, #4285F4, #EA4335, #FBBC05, #34A853);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* 5. SEARCH BAR UI */
        .search-fixed-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            display: grid; place-items: center; z-index: 9500; pointer-events: none;
        }
        .search-wrapper { 
            position: relative; display: flex; align-items: center; 
            background: #ffffff; border: 1px solid #eeeeee; padding: 5px 8px 5px 35px; 
            border-radius: 60px; box-shadow: 0 15px 40px rgba(0,0,0,0.05); 
            pointer-events: auto; width: 680px; transition: border-color 0.3s, transform 0.1s;
        }

        .error-shake { animation: shake 0.4s ease-in-out; border-color: #EA4335 !important; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }

        .input-group { position: relative; flex-grow: 1; display: flex; align-items: center; }
        .search-input { width: 100%; border: none; outline: none; background: transparent; font-family: 'Montserrat', sans-serif; font-size: 1.05rem; color: #000; z-index: 5; padding: 15px 0; }
        
        .fake-placeholder { 
            position: absolute; left: 0; font-family: 'Montserrat', sans-serif; 
            display: flex; align-items: center; white-space: nowrap; 
            pointer-events: none; transition: opacity 0.6s ease; z-index: 1;
        }

        .search-submit-btn { 
            width: 48px; height: 48px; background: #e0e0e0; border: 1px solid #000; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: 0.3s; font-size: 1.5rem; margin-left: 10px; color: #000;
        }
        .search-submit-btn:hover { background: #d0d0d0; transform: scale(1.05); }

        /* 6. MARQUEE WALL BACKGROUND */
        .marquee-wall { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 100vw; height: 100vh; 
            position: fixed; top: 0; left: 0; z-index: 1; padding: 0 20px; perspective: 1200px; pointer-events: none;
        }
        .marquee-viewport { height: 100%; position: relative; overflow: visible; pointer-events: none; }
        .design-card { 
            width: 100%; height: 65vh; position: absolute; border-radius: 15px; overflow: hidden; 
            filter: blur(14px); opacity: 0.25; backface-visibility: hidden; will-change: transform;
        }
        .design-card img { width: 100%; height: 100%; object-fit: cover; }

        @keyframes scrollUp { 0% { transform: translateY(115vh); } 100% { transform: translateY(-115vh); } }
        @keyframes scrollDown { 0% { transform: translateY(-115vh); } 100% { transform: translateY(115vh); } }
        .scroll-up .design-card { animation: scrollUp 22s linear infinite; } 
        .scroll-down .design-card { animation: scrollDown 22s linear infinite; }
        
        .design-card:nth-child(1) { animation-delay: 0s; }
        .design-card:nth-child(2) { animation-delay: -7.33s; }
        .design-card:nth-child(3) { animation-delay: -14.66s; }

        #typing-cursor { animation: blink 0.8s infinite; margin-left: 2px; }
        @keyframes blink { 50% { opacity: 0; } }

        .gradient-text { 
            font-size: 1.05rem; 
            font-weight: 800; 
            background: linear-gradient(to right, #4285F4, #EA4335, #FBBC05, #34A853); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-left: 6px; 
            opacity: 0; 
            transition: opacity 1.2s; 
            display: inline-block;
            vertical-align: middle;
        }
        .gradient-text.visible { opacity: 1; }

        /* 7. DESKTOP FOOTER ARCHITECTURE */
        .footer-socials .nav-link { font-family: 'Montserrat', sans-serif; text-decoration: none; color: #000; font-size: 0.75rem; font-weight: 600; transition: 0.3s; margin-left: 30px; display: inline-block; }
        .footer-socials .nav-link:not(.cta-link):hover { opacity: 0.5; color: #555; -webkit-text-fill-color: initial; background: none; }
        .footer-socials .cta-link { font-weight: 800; transition: 0.3s; }
        .footer-socials .cta-link:hover { transform: translateY(-2px); } 
        .copyright { font-family: 'Montserrat'; font-size: 0.7rem; font-weight: 700; color: #999; letter-spacing: 0.5px; }

        /* MOBILE SVG & TEXT CONTAINER */
        .mobile-footer-icons { display: none; gap: 16px; align-items: center; }
        .mobile-footer-icons a { display: flex; align-items: center; justify-content: center; transition: 0.3s; color: #000; text-decoration: none; }
        
        .mobile-contra-txt {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: -0.2px;
            line-height: 1;
        }

        /* 8. ULTRA-RESPONSIVE MEDIA ENGINES */
        @media (max-width: 768px) {
            header { top: 30px; padding: 0 30px; }
            footer { bottom: 35px; padding: 0 30px; }

            nav { display: none; }
            .mobile-nav-toggle { display: block; } 

            .search-wrapper {
                width: 94vw;
                max-width: 440px;
                padding: 4px 6px 4px 14px; 
            }
            .search-input { font-size: 0.76rem; padding: 12px 0; }
            .search-submit-btn { width: 38px; height: 38px; font-size: 1.1rem; margin-left: 4px; }

            .fake-placeholder { 
                font-size: 0.74rem; 
                white-space: nowrap; 
                display: flex; 
                align-items: center;
                max-width: calc(100% - 42px); 
            }
            #typing-text { font-size: 0.74rem !important; }
            .gradient-text { font-size: 0.74rem; margin-left: 4px; display: inline-block; margin-top: 0px; } 

            .marquee-wall {
                grid-template-columns: repeat(2, 1fr);
                padding: 0 10px;
                gap: 8px;
            }
            .marquee-viewport:nth-child(3),
            .marquee-viewport:nth-child(4) {
                display: none !important;
            }
            .design-card { height: 50vh; } 

            .footer-socials { display: none; }
            .mobile-footer-icons { display: flex; }
            
            .copyright { 
                font-size: 0.5rem; 
                font-weight: 700; 
                opacity: 0.5; 
            } 
        }
    </style>
</head>

    <script>
        const desktopIntro = "Hi, my name is purekid! and I'm a";
        const mobileIntro = "purekid!";
        
        const ghostHints = [
            { text: "", type: "intro_proxy", delay: 7000 }, 
            { text: "Type 'Work' to see my designs", type: "hint", delay: 5000 },
            { text: "Type 'Services' to see what I offer", type: "hint", delay: 5000 },
            { text: "Type 'About Me' to know more", type: "hint", delay: 5000 },
            { text: "Type 'Reviews' for feedback", type: "hint", delay: 5000 }
        ];
        
        const displayTarget = document.getElementById("typing-text");
        const gradientTarget = document.getElementById("gradient-part");
        const placeholderBox = document.getElementById("placeholder-box");
        const searchInput = document.getElementById("search-input");
        const searchBtn = document.getElementById("search-btn");
        const cursor = document.getElementById("typing-cursor");
        
        let charIndex = 0;
        let hintIndex = 0;

        function getCurrentIntro() { return window.innerWidth <= 768 ? mobileIntro : desktopIntro; }

        function typeIntro() {
            const intro = getCurrentIntro();
            if (charIndex < intro.length) {
                displayTarget.style.color = "#000";
                displayTarget.style.fontWeight = "600";
                displayTarget.innerHTML += intro.charAt(charIndex);
                charIndex++;
                setTimeout(typeIntro, 70);
            } else {
                setTimeout(() => {
                    gradientTarget.classList.add("visible");
                    cursor.style.display = "none";
                    hintIndex = 1; 
                    setTimeout(cycleGhostHints, 7000); 
                }, 600); 
            }
        }

        function cycleGhostHints() {
            function showNextHint() {
                if (searchInput.value === "" && document.activeElement !== searchInput) {
                    placeholderBox.style.opacity = "0"; 
                    setTimeout(() => {
                        const current = ghostHints[hintIndex];
                        if (current.type === "intro_proxy") {
                            displayTarget.style.color = "#000";
                            displayTarget.style.fontWeight = "600";
                            displayTarget.innerHTML = getCurrentIntro(); 
                            gradientTarget.style.display = "inline-block"; 
                            gradientTarget.classList.add("visible");
                        } else {
                            gradientTarget.style.display = "none";
                            displayTarget.style.color = "#888"; 
                            displayTarget.style.fontWeight = "500"; 
                            displayTarget.innerHTML = current.text;
                        }
                        placeholderBox.style.opacity = "1";
                        const currentDelay = current.delay;
                        hintIndex = (hintIndex + 1) % ghostHints.length;
                        setTimeout(showNextHint, currentDelay);
                    }, 600);
                } else {
                    setTimeout(showNextHint, 1000);
                }
            }
            showNextHint();
        }

        window.onload = typeIntro;

        function executeSearch() {
            const query = searchInput.value.toLowerCase().trim();
            const wrapper = document.querySelector('.search-wrapper');

            const homeTerms = ["home", "house", "main", "index", "homepage"];
            const workTerms = ["work", "works", "design", "designs", "project", "projects", "portfolio", "gallery"];
            const serviceTerms = ["service", "services", "offer", "offers", "pricing", "hire", "hire me"];
            const aboutTerms = ["about", "about me", "who", "purekid", "bio", "history", "profile"];
            const reviewTerms = ["review", "reviews", "feedback", "testi", "testimonials", "comments", "clients"];

            if (homeTerms.includes(query)) {
                window.location.href = "index.html";
            } 
            else if (workTerms.includes(query)) {
                window.location.href = "work.html";
            } 
            else if (serviceTerms.includes(query)) {
                window.location.href = "services.html"; 
            } 
            else if (aboutTerms.includes(query)) {
                window.location.href = "aboutme.html"; 
            } 
            else if (reviewTerms.includes(query)) {
                window.location.href = "reviews.html"; 
            } 
            else if (query !== "") {
                wrapper.classList.add('error-shake');
                searchInput.value = ""; 
                placeholderBox.style.opacity = "0"; 
                setTimeout(() => { wrapper.classList.remove('error-shake'); }, 400);
            }
        }

        searchInput.addEventListener("keypress", (e) => { if (e.key === "Enter") executeSearch(); });
        searchBtn.addEventListener("click", executeSearch);
        searchInput.addEventListener("focus", () => { placeholderBox.style.opacity = "0"; });
        searchInput.addEventListener("blur", () => { if (searchInput.value.length === 0) placeholderBox.style.opacity = "1"; });

        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        const dropdownLinks = mobileMenu.querySelectorAll('.nav-link');

        menuToggle.addEventListener('click', (e) => {
            e.stopPropagation(); 
            menuToggle.classList.toggle('open');
            mobileMenu.classList.toggle('open');
        });

        dropdownLinks.forEach(link => {
            link.addEventListener('click', () => {
                menuToggle.classList.remove('open');
                mobileMenu.classList.remove('open');
            });
        });

        document.addEventListener('click', (e) => {
            const isClickInsideMenu = mobileMenu.contains(e.target);
            const isClickInsideToggle = menuToggle.contains(e.target);
            
            if (mobileMenu.classList.contains('open') && !isClickInsideMenu && !isClickInsideToggle) {
                menuToggle.classList.remove('open');
                mobileMenu.classList.remove('open');
            }
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                menuToggle.classList.remove('open');
                mobileMenu.classList.remove('open');
            }
        });
    </script>
